name: Verify training platform
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Validate deployment configuration
        run: FRONTEND_ORIGIN=https://training.example.org docker compose -f compose.production.yml config --quiet
      - name: Validate Academy integration configuration
        run: ACADEMY_ORIGIN=http://academy.example:5173 ACADEMY_API_URL=http://academy:4000/api FRONTEND_ORIGIN=http://lab.example:5174 docker compose -f compose.academy.yml config --quiet
      - name: Build deployment images
        run: FRONTEND_ORIGIN=https://training.example.org docker compose -f compose.production.yml build
