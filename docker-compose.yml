services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - packages/backend/.env
    environment:
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_PATH: /app/data/fortisim.sqlite
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/engine/src:/app/packages/engine/src
      - classroom-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - API_PROXY_TARGET=http://backend:4000
    depends_on:
      - backend
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/engine/src:/app/packages/engine/src
      - ./packages/frontend/vite.config.ts:/app/packages/frontend/vite.config.ts
      - ./packages/frontend/tailwind.config.js:/app/packages/frontend/tailwind.config.js
      - ./packages/frontend/postcss.config.js:/app/packages/frontend/postcss.config.js

volumes:
  classroom-data:
