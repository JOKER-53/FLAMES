name: fortisim-academy
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: backend
    environment:
      PLATFORM_MODE: academy
      CONTENT_DATABASE_PATH: /data/content.sqlite
      ACADEMY_ORIGIN: ${ACADEMY_ORIGIN:?Set the exact Academy frontend origin}
      ACADEMY_API_URL: ${ACADEMY_API_URL:?Set the Academy backend URL including /api}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the exact FortiSim frontend origin}
      TRUST_PROXY: "1"
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-}
    volumes:
      - authored-content:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: frontend
    ports:
      - "${FORTISIM_BIND:-127.0.0.1}:${FORTISIM_PORT:-5174}:8080"
    volumes:
      - ./deploy/nginx.academy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  authored-content:
